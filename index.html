<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام تسجيل تأخر الطلبة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#18212f}
.wrap{max-width:980px;margin:auto;padding:18px} h1{margin:8px 0 4px} .sub{color:#64748b;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.card,.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #00000010}
.card b{display:block;font-size:26px;margin-top:6px} form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:14px;font-weight:bold} input,select,textarea,button{width:100%;padding:12px;border:1px solid #d8dee8;border-radius:10px;font-size:16px;margin-top:6px}
textarea{min-height:75px} .full{grid-column:1/-1} button{background:#167d5a;color:white;border:0;font-weight:bold;cursor:pointer}
.msg{margin-top:10px;font-weight:bold} table{width:100%;border-collapse:collapse;margin-top:12px} th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:right} th{background:#f8fafc}
.tablewrap{overflow:auto} @media(max-width:700px){.cards{grid-template-columns:1fr 1fr} form{grid-template-columns:1fr} .full{grid-column:auto} h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<h1>نظام تسجيل تأخر الطلبة</h1>
<div class="sub">تجربة مباشرة مرتبطة بقاعدة بيانات Supabase</div>

<div class="cards">
 <div class="card">إجمالي الحالات<b id="total">0</b></div>
 <div class="card">عدد الطلبة<b id="students">0</b></div>
 <div class="card">عدد الشعب<b id="classes">0</b></div>
 <div class="card">أكثر سبب<b id="topReason" style="font-size:18px">—</b></div>
</div>

<div class="panel">
<h2>تسجيل حالة تأخير</h2>
<form id="lateForm">
 <label>اسم الطالب<input id="student_name" required></label>
 <label>الشعبة<input id="class_name" required placeholder="مثال: 5 تجر 2"></label>
 <label>التاريخ<input id="late_date" type="date" required></label>
 <label>وقت الحضور<input id="arrival_time" type="time" required></label>
 <label>سبب التأخير
  <select id="reason">
   <option>مواصلات</option><option>ظرف عائلي</option><option>موعد صحي</option>
   <option>نوم متأخر</option><option>بدون عذر</option><option>أخرى</option>
  </select>
 </label>
 <label>ملاحظات<input id="notes"></label>
 <div class="full"><button type="submit">حفظ حالة التأخير</button></div>
</form>
<div class="msg" id="msg"></div>
</div>

<div class="panel" style="margin-top:16px">
<h2>السجلات</h2>
<div class="tablewrap"><table>
<thead><tr><th>الطالب</th><th>الشعبة</th><th>التاريخ</th><th>الوقت</th><th>السبب</th><th>ملاحظات</th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
</div>
</div>

<script>
const client = supabase.createClient("https://chkczeusxnifayswhvqo.supabase.co", "sb_publishable_ylT-mRYXiTu-KHp-aD8J9w_EVv9Xz6p");
const $ = id => document.getElementById(id);
$("late_date").value = new Date().toISOString().slice(0,10);

async function loadData(){
 const {data,error} = await client.from("late_students").select("*").order("id",{ascending:false});
 if(error){ $("msg").textContent="خطأ في قراءة البيانات: "+error.message; return; }
 $("rows").innerHTML = data.map(r=>`<tr><td>${esc(r.student_name)}</td><td>${esc(r.class_name)}</td><td>${r.late_date}</td><td>${(r.arrival_time||"").slice(0,5)}</td><td>${esc(r.reason||"")}</td><td>${esc(r.notes||"")}</td></tr>`).join("");
 $("total").textContent=data.length;
 $("students").textContent=new Set(data.map(x=>x.student_name)).size;
 $("classes").textContent=new Set(data.map(x=>x.class_name)).size;
 const c={}; data.forEach(x=>{if(x.reason)c[x.reason]=(c[x.reason]||0)+1});
 $("topReason").textContent=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||"—";
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

$("lateForm").addEventListener("submit",async e=>{
 e.preventDefault(); $("msg").textContent="جارٍ الحفظ...";
 const record={student_name:$("student_name").value.trim(),class_name:$("class_name").value.trim(),
 late_date:$("late_date").value,arrival_time:$("arrival_time").value,reason:$("reason").value,notes:$("notes").value.trim()};
 const {error}=await client.from("late_students").insert(record);
 if(error){$("msg").textContent="تعذر الحفظ: "+error.message;return;}
 $("msg").textContent="تم حفظ حالة التأخير بنجاح ✓";
 $("student_name").value=""; $("class_name").value=""; $("notes").value="";
 await loadData();
});
loadData();
</script>
</body></html>
