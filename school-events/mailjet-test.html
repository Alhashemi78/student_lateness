<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار Mailjet | الفعاليات المدرسية</title><style>body{font-family:system-ui,Tahoma,sans-serif;background:#f1f6f5;color:#123e49;padding:24px;line-height:1.9}main{max-width:520px;margin:50px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 8px 35px #123e4914}button{background:#087f72;color:white;border:0;border-radius:12px;padding:13px 20px;font-size:17px;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap}a{color:#087f72}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script></head><body><main><h2>اختبار إرسال البريد عبر Mailjet</h2><p>هذه صفحة اختبار مستقلة لا تغيّر بيانات الفعاليات. سجّل الدخول أولًا في <a href="./index.html">برنامج الفعاليات</a> من هذا المتصفح، ثم ارجع هنا.</p><p>الوجهة: <b dir="ltr">zead07@hotmail.com</b></p><button id="send" disabled>جارٍ فحص تسجيل الدخول…</button><p id="result" role="status"></p></main><script>
const client=window.supabase.createClient('https://chkczeusxnifayswhvqo.supabase.co','sb_publishable_ylT-mRYXiTu-KHp-aD8J9w_EVv9Xz6p',{auth:{storageKey:'school-events-auth',detectSessionInUrl:true}});
const btn=document.getElementById('send'),result=document.getElementById('result');
let current=null;
async function refresh(){const {data,error}=await client.auth.getSession();current=data?.session||null;const email=current?.user?.email?.toLowerCase();if(!current){btn.textContent='سجّل الدخول في برنامج الفعاليات أولًا';result.textContent='لم يُعثر على جلسة دخول في هذا المتصفح.';return;}if(email!=='zead07@hotmail.com'){btn.textContent='هذا الاختبار مخصص لحساب الإدارة';result.textContent='الحساب الحالي ليس بريد الاختبار.';return;}btn.disabled=false;btn.textContent='إرسال رسالة اختبار الآن';result.textContent='تم التحقق من تسجيل الدخول.';}
btn.addEventListener('click',async()=>{btn.disabled=true;result.textContent='جارٍ إرسال طلب الاختبار…';try{const {data,error}=await client.functions.invoke('school-events-mailjet-test',{body:{test:true}});if(error){let detail='';try{detail=JSON.stringify(await error.context?.json());}catch{}throw Error(error.message+(detail?' — '+detail:''));}result.textContent=data?.sent?'قبل Mailjet رسالة الاختبار. افحص صندوق البريد والوارد غير الهام.':'استجابة الخدمة: '+JSON.stringify(data);}catch(e){result.textContent='فشل الاختبار: '+e.message;}finally{btn.disabled=false;}});
refresh();
</script></body></html>
